services:
  engine-db:
    image: postgres:18.6
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: engine
      POSTGRES_PASSWORD: ${GOOSE_DB_PASSWORD}
      POSTGRES_DB: engine
    volumes:
      - "engine-db-data:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engine -d engine"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  engine-db-data:
